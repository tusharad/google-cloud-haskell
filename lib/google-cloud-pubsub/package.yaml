name:                google-cloud-pubsub
version:             1.1.0.0
github:              "tusharad/google-cloud-haskell"
license:             MIT
author:              "tushar"
maintainer:          "tusharadhatrao@gmail.com"
copyright:           "2025 tushar"
category:            Web
synopsis:            GCP Pub/Sub Client for Haskell

extra-source-files:
- README.md
- CHANGELOG.md

description: GCP Pub/Sub topic and subscription client for Haskell.

dependencies:
- base >= 4.7 && < 5
- bytestring >= 0.9.1.4
- base64-bytestring
- text >= 1.2 && <3
- aeson < 3
- containers
- http-types
- http-conduit
- google-cloud-common >= 1.1.0.0 && < 1.2.0.0

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

tests:
  google-cloud-pubsub-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - google-cloud-pubsub
    - tasty >= 1.4
    - tasty-hunit >= 0.10
