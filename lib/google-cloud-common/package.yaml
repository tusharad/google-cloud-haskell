name:                google-cloud-common
version:             1.1.0.0
github:              "tusharad/google-cloud-haskell"
license:             MIT
author:              "tushar"
maintainer:          "tusharadhatrao@gmail.com"
copyright:           "2025 tushar"
category:            Web
synopsis:            GCP Client for Haskell

extra-source-files:
- README.md
- CHANGELOG.md

description: A common module for all GCP Client packages.

dependencies:
- base >= 4.7 && < 5
- aeson < 3
- bytestring >= 0.9.1.4
- containers  >= 0.6 && <1
- http-conduit >= 2.2 && < 2.4
- jwt >= 0.11 && < 0.12
- time >= 1.9 && < 1.15
- text >= 1.2 && <3

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

tests:
  google-cloud-common-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - google-cloud-common
    - hspec >= 1.3
